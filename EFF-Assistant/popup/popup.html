<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EFF Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="head">
      <div class="brand">
        <div class="logo"><span></span><span></span></div>
        <div><h1>EFF Assistant</h1><p id="connectionText">正在读取状态…</p></div>
      </div>
      <div class="head-status">
        <button id="themeToggle" class="theme-toggle" type="button" title="切换浅色模式" aria-label="切换浅色模式">☼</button>
        <span class="ai-pill" id="platformAI">平台AI</span>
        <span class="ai-pill" id="quickAI">插件AI</span>
        <span class="dot" id="connectionDot"></span>
      </div>
    </header>

    <section class="controls toolbar">
      <button id="toggleAssistant" class="primary">显示助手</button>
      <button id="refreshPage">重新解析</button>
      <button id="syncDevices">同步插件</button>
    </section>

    <section class="action-grid" id="popupActions">
      <button class="popup-action quick" type="button" data-action="quick"><span>ϟ</span><b>快速研判</b></button>
      <button class="popup-action correlate" type="button" data-action="correlate"><span>⛓</span><b>关联分析</b></button>
      <button class="popup-action ticket platform-only" type="button" data-action="ticket" hidden><span>▣</span><b>生成工单</b></button>
      <button class="popup-action smart platform-only" type="button" data-action="smart" hidden><span>◎</span><b>智能分析</b></button>
    </section>

    <section class="action-status" id="actionStatus" hidden>
      <div>
        <strong id="actionStatusTitle">操作状态</strong>
        <p id="actionStatusText">等待操作</p>
      </div>
      <div class="action-status-buttons">
        <button id="pinWidgetDetail" type="button">固定到页面助手</button>
        <button id="viewWidgetDetail" type="button">查看详情</button>
      </div>
      <button id="runCorrelationNow" class="run-correlation-now" type="button" hidden>开始关联分析</button>
    </section>

    <section class="history-card folded">
      <div class="history-head">
        <strong>操作历史</strong>
        <div class="history-head-actions">
          <button id="toggleHistoryFold" type="button">展开</button>
          <button id="refreshHistory" type="button">刷新</button>
          <button id="openHistoryPage" type="button">详情</button>
        </div>
      </div>
      <div id="historyList" class="history-list">
        <div class="history-empty">暂无操作历史</div>
      </div>
    </section>

    <section class="menu">
      <button id="openOptions"><span>打开设置页面</span><b>›</b></button>
      <button id="viewText"><span>查看采集文本</span><b>›</b></button>
    </section>

    <div id="message" class="message"></div>
  </main>

  <dialog id="textDialog">
    <div class="dialog-head">
      <strong>当前页面采集文本</strong>
      <div class="dialog-actions">
        <button id="copyText" type="button">复制</button>
        <button id="closeDialog" type="button" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="dialog-meta" id="textMeta"></div>
    <pre id="textContent"></pre>
  </dialog>

  <script src="popup.js"></script>
</body>
</html>
